name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      # actions/checkout@v4 (пин на коммит — воспроизводимость CI)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # тулчейн пинется явно (и rust-toolchain.toml локально);
      # rustfmt/clippy нужны в minimal-профиле экшена
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
